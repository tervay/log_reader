[project]
name = "wpilog"
version = "0.1.0"
description = "Agent-friendly WPILOG reader that prints JSON"
requires-python = ">=3.10"
dependencies = [
    "orjson>=3.13.0",
    "robotpy-wpiutil==2026.2.2",
]

[project.scripts]
wpilog = "wpilog:main"

[dependency-groups]
dev = ["pytest", "pyinstaller"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["wpilog.py"]
