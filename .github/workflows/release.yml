name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: wpilog-linux-x86_64 }
          - { os: ubuntu-24.04-arm, name: wpilog-linux-arm64 }
          - { os: windows-latest, name: wpilog-windows-x86_64.exe }
          - { os: macos-latest, name: wpilog-macos-arm64 }
          - { os: macos-15-intel, name: wpilog-macos-x86_64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run pytest -q
      - run: uv run pyinstaller --onefile --name wpilog --collect-binaries native.wpiutil wpilog.py
      - run: mv dist/wpilog* dist/${{ matrix.name }}
      - run: dist/${{ matrix.name }} --help
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create ${{ github.ref_name }} dist/* --repo ${{ github.repository }} --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
